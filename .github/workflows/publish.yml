name: Publish owner-approved carousel

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: instagram-publish-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.pull_request.merged == true &&
      vars.POST_APPROVER != '' &&
      github.event.pull_request.merged_by.login == vars.POST_APPROVER &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      startsWith(github.event.pull_request.head.ref, 'content/')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check approved change scope
        id: approved
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          python - <<'PY'
          import json, os, re, subprocess
          repo, number = os.environ["GITHUB_REPOSITORY"], os.environ["PR_NUMBER"]
          def read(endpoint):
              return json.loads(subprocess.check_output(["gh", "api", endpoint]))
          metadata = read(f"repos/{repo}")
          assert not metadata["private"], "Instagram needs publicly accessible JPEGs"
          files = read(f"repos/{repo}/pulls/{number}/files?per_page=100")
          assert 3 <= len(files) <= 11, "Expected one new carousel only"
          ids = set()
          for file in files:
              match = re.fullmatch(r"content/([a-z0-9-]{1,80})/(post\.json|0[1-9]\.jpg|10\.jpg)", file["filename"])
              assert match and file["status"] == "added", "Only new post files may be approved"
              ids.add(match[1])
          assert len(ids) == 1, "Expected exactly one post"
          assert re.fullmatch(r"[0-9a-f]{40}", os.environ["MERGE_SHA"])
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"post_id={ids.pop()}\n")
          PY
      # Never run scripts or install dependencies from the pull request.
      - uses: actions/checkout@v4.3.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Load only approved content from the merge commit
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          POST_ID: ${{ steps.approved.outputs.post_id }}
        run: |
          git fetch origin "$MERGE_SHA" --depth=1
          git checkout "$MERGE_SHA" -- "content/$POST_ID"
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Recheck today's records and publish
        env:
          POST_ID: ${{ steps.approved.outputs.post_id }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ vars.INSTAGRAM_USER_ID }}
          INSTAGRAM_GRAPH_VERSION: ${{ vars.INSTAGRAM_GRAPH_VERSION }}
        run: |
          export OPENAI_MODEL="${OPENAI_MODEL:-gpt-4.1}"
          python pipeline.py publish --id "$POST_ID" --sha "$MERGE_SHA"
