name: Monitor news

on:
  schedule:
    - cron: "15 1 * * *"          # daily 06:45 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: register

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: cd scripts && python monitor.py
      - name: Commit Inbox
        run: |
          git config user.name "myfriend-adani-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Inbox: news scan $(date -u +%F)"
          git push
