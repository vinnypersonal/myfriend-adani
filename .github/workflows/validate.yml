name: Validate posts

on:
  pull_request:
    paths: ["posts/**", "data/**", "scripts/**"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Legal-safety and sourcing gate
        run: cd scripts && python validate.py
